<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Librería Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <header>
        <div class="brand">
            <h1>Librería Virtual</h1>
        </div>
        <nav>
            <a href="/">Catálogo</a>
            <a href="/carrito">Carrito</a>
            <a href="/login">Entrar</a>
        </nav>
    </header>

    <main class="container">
        <section class="card" style="max-width: 400px; margin: 50px auto;">
            <h2>Identifícate</h2>

            <!-- Formulario de Login Principal -->
            <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label>Correo electrónico</label>
                    <input type="email" name="email" required style="width: 100%;">
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between;">
                        <label>Contraseña</label>
                        <!-- Enlace para activar la recuperación -->
                        <a href="#recuperar" onclick="mostrarRecuperacion()"
                            style="font-size: 0.8rem; color: var(--primary);">¿Olvidaste tu clave?</a>
                    </div>
                    <input type="password" name="password" required style="width: 100%;">
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <!-- Sección de Recuperación (Oculta por defecto) -->
            <div id="seccionRecuperar"
                style="display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee;">
                <h3 style="font-size: 1rem;">Recuperar acceso</h3>
                <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">Introduce tu email y te enviaremos un
                    enlace de Mailtrap.</p>
                <form action="/olvide-password" method="POST"
                    style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="email" name="email" placeholder="tu@email.com" required style="width: 100%;">
                    <button type="submit" class="btn" style="background: #6c757d; color: white;">Enviar enlace</button>
                </form>
            </div>

            <p style="margin-top: 20px; text-align: center;">
                ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <script>
        // Función simple para mostrar/ocultar la recuperación sin cambiar de página
        function mostrarRecuperacion() {
            const seccion = document.getElementById('seccionRecuperar');
            seccion.style.display = seccion.style.display === 'none' ? 'block' : 'none';
        }
    </script>
    <div id="toastContainer"></div>
</body>

</html>
